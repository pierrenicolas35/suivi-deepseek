name: Qualité & déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Vérification : tests, cohérence du JSON publié, absence de secret.
  # ------------------------------------------------------------------
  qualite:
    name: Tests et cohérence des données
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Dépendances de test
        run: python -m pip install --quiet pytest pyyaml

      - name: Tests unitaires
        run: python -m pytest tests -q

      - name: Le document publié ne doit contenir aucun secret
        run: |
          if grep -nE "sk-[A-Za-z0-9]|BEGIN [A-Z ]*PRIVATE KEY|ghp_|gho_" docs/data/suivi.json; then
            echo "::error::un secret semble présent dans docs/data/suivi.json"
            exit 1
          fi

      - name: Publication de l'artefact statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # ------------------------------------------------------------------
  # Déploiement GitHub Pages (branche principale uniquement).
  # ------------------------------------------------------------------
  deploiement:
    name: Déploiement GitHub Pages
    needs: qualite
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déploiement
        id: deploiement
        uses: actions/deploy-pages@v4
